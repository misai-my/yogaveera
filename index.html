<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isha Yogaveera Training</title>
  <link rel="icon" type="image/x-icon" href="https://training.ishayoga.eu/static/indigo/images/favicon.049a0f1a2bb1.ico" />

  <style>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      min-height:100%;
      color:#313131;
      background:#fff;
      font-family:"Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size:16px;
      line-height:1.5;
    }

    body.ltr{
      direction:ltr;
    }

    a{
      color:#0075b4;
      text-decoration:none;
    }

    a:hover{
      text-decoration:underline;
    }

    .window-wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .sr-only,
    .sr{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    .sr-only-focusable:focus{
      position:fixed;
      top:10px;
      left:10px;
      width:auto;
      height:auto;
      clip:auto;
      padding:10px 14px;
      background:#fff;
      color:#111;
      z-index:9999;
      border:2px solid #0075b4;
      border-radius:3px;
    }

    /* Header */
    .global-header{
      position:relative;
      z-index:10;
      background:#fff;
      border-bottom:1px solid #e5e5e5;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
    }

    .main-header{
      width:100%;
      max-width:1180px;
      margin:0 auto;
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 32px;
      gap:24px;
    }

    .header-logo{
      margin:0;
      line-height:1;
    }

    .header-logo a{
      display:inline-flex;
      align-items:center;
    }

    .header-logo .logo{
      display:block;
      max-height:52px;
      max-width:178px;
      object-fit:contain;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:24px;
      margin-left:auto;
      font-size:14px;
    }

    .nav-links .secondary,
    .nav-links .secondary > div{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 16px;
      min-height:38px;
      border-radius:3px;
      border:1px solid #0075b4;
      font-weight:600;
      line-height:1.2;
      text-decoration:none;
      transition:background .18s ease, color .18s ease, border-color .18s ease;
    }

    .register-btn{
      color:#0075b4;
      background:#fff;
    }

    .btn:hover{
      text-decoration:none;
      background:#065f91;
      border-color:#065f91;
      color:#fff;
    }

    .language-switcher{
      display:flex;
      align-items:center;
      gap:8px;
      margin-left:4px;
      color:#555;
      font-weight:600;
      white-space:nowrap;
    }

    .language-switcher select{
      height:36px;
      min-width:118px;
      border:1px solid #c8c8c8;
      border-radius:3px;
      background:#fff;
      padding:0 10px;
      color:#333;
      font:inherit;
      cursor:pointer;
    }

    .hamburger-menu{
      display:none;
      width:42px;
      height:38px;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:4px;
      cursor:pointer;
      margin-left:auto;
    }

    .hamburger-menu .line{
      display:block;
      width:24px;
      height:2px;
      background:#444;
      border-radius:2px;
    }

    .mobile-menu{
      display:none;
      border-top:1px solid #eee;
      background:#fff;
      padding:12px 20px 18px;
    }

    .mobile-menu.hidden{
      display:none;
    }

    .mobile-menu.open{
      display:block;
    }

    .mobile-menu a,
    .mobile-menu label{
      display:block;
      padding:10px 0;
      color:#333;
      font-weight:600;
    }

    .mobile-menu .btn{
      text-align:center;
      margin-top:6px;
      padding:10px 14px;
      width:100%;
    }

    .mobile-menu select{
      width:100%;
      height:38px;
      margin-top:6px;
      padding:0 10px;
    }

    /* Hero */
    .marketing-hero{
      min-height:260px;
      background:
        linear-gradient(rgba(0,0,0,.23), rgba(0,0,0,.23)),
        url("https://www.ishayoga.eu/wp-content/uploads/2021/04/isha-yoga-center-london-home-banner.jpg") center center / cover no-repeat;
    }

    .content-wrapper{
      flex:1 0 auto;
    }

    .main-container{
      width:100%;
    }

    .home > header{
      background:#f8f8f8;
      border-bottom:1px solid #e5e5e5;
    }

    .outer-wrapper{
      max-width:1180px;
      margin:0 auto;
      padding:48px 32px 42px;
    }

    .title{
      max-width:780px;
    }

    .heading-group h1{
      margin:0 0 10px;
      color:#333;
      font-family:Georgia, "Times New Roman", serif;
      font-weight:400;
      font-size:42px;
      line-height:1.16;
    }

    .heading-group p{
      margin:0;
      color:#555;
      font-size:18px;
      line-height:1.55;
    }

    .heading-group img{
      display:block;
      width:112px;
      max-width:100%;
      height:auto;
      margin-top:12px;
    }

    /* Courses */
    .courses-container{
      background:#fff;
      padding:42px 32px 60px;
    }

    .highlighted-courses{
      max-width:1180px;
      margin:0 auto;
    }

    .courses-listing{
      list-style:none;
      margin:0;
      padding:0;
      display:grid;
      grid-template-columns:minmax(280px, 360px);
      gap:28px;
    }

    .courses-listing-item{
      min-width:0;
    }

    .course{
      background:#fff;
      border:1px solid #d8d8d8;
      border-radius:2px;
      overflow:hidden;
      min-height:100%;
      box-shadow:0 1px 2px rgba(0,0,0,.09);
      transition:box-shadow .18s ease, transform .18s ease;
    }

    .course:hover{
      box-shadow:0 4px 10px rgba(0,0,0,.16);
      transform:translateY(-1px);
    }

    .course a{
      display:block;
      color:inherit;
      text-decoration:none;
      min-height:100%;
    }

    .course-image{
      position:relative;
      margin:0;
      background:#f0f0f0;
    }

    .cover-image{
      position:relative;
      aspect-ratio:16/9;
      overflow:hidden;
      background:#eee;
    }

    .cover-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .22s ease;
    }

    .course:hover .cover-image img{
      transform:scale(1.035);
    }

    .learn-more{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      background:rgba(0,117,180,.92);
      color:#fff;
      text-align:center;
      padding:11px 10px;
      font-size:13px;
      font-weight:700;
      letter-spacing:.04em;
      transform:translateY(100%);
      transition:transform .2s ease;
    }

    .course:hover .learn-more{
      transform:translateY(0);
    }

    .course-info{
      padding:18px 18px 20px;
      min-height:138px;
    }

    .course-name{
      margin:0;
      font-size:17px;
      line-height:1.35;
      color:#333;
      font-weight:600;
    }

    .course-organization,
    .course-code{
      display:block;
      color:#777;
      font-size:12px;
      line-height:1.35;
      font-weight:600;
      text-transform:none;
    }

    .course-title{
      display:block;
      margin-top:7px;
      color:#333;
      min-height:46px;
    }

    .course-date{
      margin-top:14px;
      color:#666;
      font-size:13px;
    }

    /* Footer */
    .wrapper-footer{
      background:#f8f8f8;
      border-top:1px solid #e3e3e3;
      flex-shrink:0;
    }

    #footer-openedx{
      max-width:1180px;
      margin:0 auto;
      padding:34px 32px 30px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:28px;
      color:#666;
      font-size:13px;
    }

    .nav-colophon ol,
    .nav-legal ul{
      display:flex;
      flex-wrap:wrap;
      gap:12px 20px;
      list-style:none;
      padding:0;
      margin:0 0 18px;
    }

    .wrapper-logo img{
      max-height:44px;
      width:auto;
    }

    .copyright{
      max-width:780px;
      margin:14px 0 16px;
      color:#777;
    }

    @media (max-width:820px){
      .main-header{
        min-height:68px;
        padding:0 20px;
      }

      .nav-links{
        display:none;
      }

      .hamburger-menu{
        display:flex;
      }

      .marketing-hero{
        min-height:210px;
      }

      .outer-wrapper,
      .courses-container,
      #footer-openedx{
        padding-left:20px;
        padding-right:20px;
      }

      .heading-group h1{
        font-size:34px;
      }

      .heading-group p{
        font-size:16px;
      }

      #footer-openedx{
        grid-template-columns:1fr;
      }
    }

    @media (max-width:620px){
      .marketing-hero{
        min-height:170px;
      }

      .outer-wrapper{
        padding-top:34px;
        padding-bottom:34px;
      }

      .courses-container{
        padding-top:30px;
      }

      .courses-listing{
        grid-template-columns:1fr;
        gap:22px;
      }

      .course-info{
        min-height:auto;
      }

      .course-title{
        min-height:auto;
      }
    }
  </style>
</head>
<body class="ltr lang_en">
  <div id="page-prompt"></div>
  <div class="window-wrap" dir="ltr">
    <a class="nav-skip sr-only sr-only-focusable" href="#main" data-i18n="skip">Skip to main content</a>

    <header class="global-header">
      <div class="main-header">
        <h1 class="header-logo">
          <a href="dashboard.html" aria-label="Isha Yogaveera Training Home Page" data-i18n-aria="homeAria">
            <img class="logo" src="https://training.ishayoga.eu/static/indigo/images/logo.45c36d811e2d.png" alt="Isha Yogaveera Training Home Page" data-i18n-alt="homeAria" />
          </a>
        </h1>

        <div class="hamburger-menu" role="button" aria-label="Options Menu" aria-expanded="false" aria-controls="mobile-menu" tabindex="0">
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
        </div>

        <nav class="nav-links" aria-label="Supplemental Links" data-i18n-aria="supplementalLinks">
          <div class="secondary">
            <div>
              <div class="mobile-nav-item hidden-mobile nav-item">
                <a class="register-btn btn" href="registration.html" data-i18n="register">Register</a>
              </div>
              <div class="language-switcher">
                <label for="languageSelect" data-i18n="language">Language</label>
                <select id="languageSelect" aria-label="Language">
                  <option value="en">English</option>
                  <option value="ta">தமிழ்</option>
                </select>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <div class="mobile-menu hidden" aria-label="More Options" role="menu" id="mobile-menu">
        <a class="register-btn btn" href="registration.html" data-i18n="register">Register</a>
        <label for="languageSelectMobile" data-i18n="language">Language</label>
        <select id="languageSelectMobile" aria-label="Language">
          <option value="en">English</option>
          <option value="ta">தமிழ்</option>
        </select>
      </div>
    </header>

    <div class="marketing-hero"></div>

    <div class="content-wrapper main-container" id="content" dir="ltr">
      <main id="main" aria-label="Content" tabindex="-1">
        <section class="home">
          <header>
            <div class="outer-wrapper">
              <div class="title">
                <div class="heading-group">
                  <h1 data-i18n="pageTitle">Isha Yogaveera Training</h1>
                  <p data-i18n="tagline">Yoga works miraculously. The only thing is, you have to do it. -Sadhguru</p>
                  <br />
                  <img src="https://www.ishayoga.eu/wp-content/themes/iyc_lon/img/divider-yoga.svg" alt="" />
                </div>
              </div>
            </div>
          </header>

          <section class="courses-container">
            <section class="highlighted-courses">
              <section class="courses">
                <ul class="courses-listing" id="coursesListing"></ul>
              </section>
            </section>
          </section>
        </section>
      </main>
    </div>

    <div class="wrapper wrapper-footer">
      <footer id="footer-openedx" class="grid-container">
        <div class="colophon">
          <nav class="nav-colophon" aria-label="About" data-i18n-aria="aboutAria">
            <ol>
              <li><a href="https://misai-my.github.io/yogaveera/work-in-progress" data-i18n="about">About</a></li>
              <li><a href="https://misai-my.github.io/yogaveera/work-in-progress" data-i18n="contact">Contact</a></li>
            </ol>
          </nav>

          <div class="wrapper-logo">
            <p>
              <a href="dashboard.html">
                <img alt="organization logo" src="https://training.ishayoga.eu/static/indigo/images/logo.45c36d811e2d.png" data-i18n-alt="organizationLogo" />
              </a>
            </p>
          </div>
          
          <p class="copyright" data-i18n="copyright">© Isha Yogaveera Training. All rights reserved except where noted. </p>
          
          <nav class="nav-legal" aria-label="Legal" data-i18n-aria="legalAria">
            <ul>
              <li><a href="https://misai-my.github.io/yogaveera/work-in-progress" data-i18n="tos">Terms of service</a></li>
              
            </ul>
          </nav>
        </div>
      </footer>
    </div>
  </div>

  <template id="courseTemplate">
    <li class="courses-listing-item">
      <article class="course" role="region">
        <a class="course-link" href="#">
          <header class="course-image">
            <div class="cover-image">
              <img class="course-img" src="" alt="" />
              <div class="learn-more"></div>
            </div>
          </header>
          <div class="course-info" aria-hidden="true">
            <h2 class="course-name">
              <span class="course-organization"></span>
              <span class="course-code"></span>
              <span class="course-title"></span>
            </h2>
            <div class="course-date"></div>
          </div>
          <div class="sr">
            <ul>
              <li class="sr-org"></li>
              <li class="sr-code"></li>
              <li class="sr-date"></li>
            </ul>
          </div>
        </a>
      </article>
    </li>
  </template>

  <script>
    const translations = {
      en: {
        htmlLang: "en",
        skip: "Skip to main content",
        homeAria: "Isha Yogaveera Training Home Page",
        supplementalLinks: "Supplemental Links",
        register: "Register",
        language: "Language",
        pageTitle: "Isha Yogaveera Training",
        tagline: "Yoga works miraculously. The only thing is, you have to do it. -Sadhguru",
        learnMore: "LEARN MORE",
        starts: "Starts: {date}",
        aboutAria: "About",
        about: "About",
        contact: "Contact",
        organizationLogo: "organization logo",
        copyright: "© Isha Yogaveera Training. All rights reserved except where noted.",
        legalAria: "Legal",
        tos: "Terms of service"
      },
      ta: {
        htmlLang: "ta",
        skip: "முக்கிய உள்ளடக்கத்திற்குச் செல்லவும்",
        homeAria: "ஈஷா யோக வீரா பயிற்சி முகப்பு பக்கம்",
        supplementalLinks: "கூடுதல் இணைப்புகள்",
        register: "பதிவு செய்யவும்",
        language: "மொழி",
        pageTitle: "ஈஷா யோக வீரா பயிற்சி",
        tagline: "யோகா அதிசயமாக செயல்படுகிறது. நீங்கள் அதை செய்ய வேண்டும் என்பதே ஒரே விஷயம். -சத்குரு",
        learnMore: "மேலும் அறிக",
        starts: "தொடக்கம்: {date}",
        aboutAria: "பற்றி",
        about: "பற்றி",
        contact: "தொடர்பு",
        organizationLogo: "நிறுவன லோகோ",
        copyright: "© ஈஷா யோக வீரா பயிற்சி. குறிப்பிடப்பட்ட இடங்களைத் தவிர அனைத்து உரிமைகளும் பாதுகாக்கப்பட்டவை.",
        legalAria: "சட்டம்",
        tos: "சேவை விதிமுறைகள்"
      }
    };

    const courseData = [
      {
        id: "course-v1:Isha+CS001+2023",
        href: "course-details.html",
        image: "https://training.ishayoga.eu/asset-v1:Isha+CS001+2023+type@asset+block@Using_an_Online_Platform__Google_Meet_Tutorial.png",
        organization: "Isha",
        code: ".",
        date: "2023-05-24T12:30:00+0000",
        title: {
          en: "Yoga Veera Online Course",
          ta: "யோக வீரா ஆன்லைன் பாடநெறி"
        }
      }
    ];

    const listing = document.getElementById("coursesListing");
    const template = document.getElementById("courseTemplate");
    const languageSelect = document.getElementById("languageSelect");
    const languageSelectMobile = document.getElementById("languageSelectMobile");
    const hamburger = document.querySelector(".hamburger-menu");
    const mobileMenu = document.getElementById("mobile-menu");

    function formatDate(dateValue, lang){
      const date = new Date(dateValue);
      return new Intl.DateTimeFormat(lang, {
        year: "numeric",
        month: "short",
        day: "numeric"
      }).format(date);
    }

    function getCurrentLang(){
      return localStorage.getItem("ishaTrainingLang") || "en";
    }

    function setLanguage(lang){
      const safeLang = translations[lang] ? lang : "en";
      const t = translations[safeLang];

      localStorage.setItem("ishaTrainingLang", safeLang);
      document.documentElement.lang = t.htmlLang;
      document.body.className = `ltr lang_${safeLang}`;

      languageSelect.value = safeLang;
      languageSelectMobile.value = safeLang;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if(t[key]) el.textContent = t[key];
      });

      document.querySelectorAll("[data-i18n-aria]").forEach(el => {
        const key = el.getAttribute("data-i18n-aria");
        if(t[key]) el.setAttribute("aria-label", t[key]);
      });

      document.querySelectorAll("[data-i18n-alt]").forEach(el => {
        const key = el.getAttribute("data-i18n-alt");
        if(t[key]) el.setAttribute("alt", t[key]);
      });

      renderCourses(safeLang);
    }

    function renderCourses(lang){
      const t = translations[lang] || translations.en;
      listing.innerHTML = "";

      courseData.forEach(course => {
        const node = template.content.cloneNode(true);
        const article = node.querySelector("article");
        const link = node.querySelector(".course-link");
        const image = node.querySelector(".course-img");
        const learnMore = node.querySelector(".learn-more");
        const org = node.querySelector(".course-organization");
        const code = node.querySelector(".course-code");
        const title = node.querySelector(".course-title");
        const date = node.querySelector(".course-date");
        const srOrg = node.querySelector(".sr-org");
        const srCode = node.querySelector(".sr-code");
        const srDate = node.querySelector(".sr-date");

        const localizedTitle = course.title[lang] || course.title.en;
        const localizedDate = t.starts.replace("{date}", formatDate(course.date, lang));

        article.id = course.id;
        article.setAttribute("aria-label", localizedTitle);
        link.href = course.href;
        image.src = course.image;
        image.alt = `${localizedTitle} ${course.code}`;
        learnMore.textContent = t.learnMore;
        org.textContent = course.organization;
        code.textContent = course.code;
        title.textContent = localizedTitle;
        date.textContent = localizedDate;
        srOrg.textContent = course.organization;
        srCode.textContent = course.code;
        srDate.textContent = localizedDate;

        listing.appendChild(node);
      });
    }

    function toggleMobileMenu(){
      const isOpen = mobileMenu.classList.toggle("open");
      mobileMenu.classList.toggle("hidden", !isOpen);
      hamburger.setAttribute("aria-expanded", String(isOpen));
    }

    languageSelect.addEventListener("change", event => setLanguage(event.target.value));
    languageSelectMobile.addEventListener("change", event => setLanguage(event.target.value));

    hamburger.addEventListener("click", toggleMobileMenu);
    hamburger.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        toggleMobileMenu();
      }
    });

    setLanguage(getCurrentLang());
  </script>
</body>
</html>
